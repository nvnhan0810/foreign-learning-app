    <g transform="translate(180 240)"><rect x="-30" y="-30" width="60" height="60" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/></g>
    <g transform="translate(250 240)"><rect x="-30" y="-30" width="60" height="60" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/></g>
