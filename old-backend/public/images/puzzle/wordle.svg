    <g transform="translate(180 90)"><rect x="-30" y="-30" width="60" height="60" rx="10" fill="#c9b458"/><text x="0" y="12">O</text></g>
    <g transform="translate(250 90)"><rect x="-30" y="-30" width="60" height="60" rx="10" fill="#3a3a3c"/><text x="0" y="12">R</text></g>
    <g transform="translate(320 90)"><rect x="-30" y="-30" width="60" height="60" rx="10" fill="#3a3a3c"/><text x="0" y="12">D</text></g>
