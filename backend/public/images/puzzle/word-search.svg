<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ws-bg" x1="0" y1="0" x2="400" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b21b6"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="24" fill="url(#ws-bg)"/>
  <!-- highlight path -->
  <rect x="72" y="118" width="256" height="52" rx="26" fill="#fbbf24" opacity="0.9"/>
  <g font-family="system-ui, sans-serif" font-weight="800" font-size="30" fill="#ffffff" text-anchor="middle" opacity="0.85">
    <!-- row a -->
    <text x="100" y="80">Q</text><text x="160" y="80">R</text><text x="220" y="80">T</text><text x="280" y="80">Z</text><text x="330" y="80">B</text>
    <!-- row b (word, dark on highlight) -->
    <text x="100" y="155" fill="#4c1d95" font-weight="900">F</text>
    <text x="160" y="155" fill="#4c1d95" font-weight="900">I</text>
    <text x="220" y="155" fill="#4c1d95" font-weight="900">N</text>
    <text x="280" y="155" fill="#4c1d95" font-weight="900">D</text>
    <text x="330" y="155">K</text>
    <!-- row c -->
    <text x="100" y="220">M</text><text x="160" y="220">P</text><text x="220" y="220">X</text><text x="280" y="220">C</text><text x="330" y="220">W</text>
    <!-- row d -->
    <text x="100" y="270">S</text><text x="160" y="270">L</text><text x="220" y="270">E</text><text x="280" y="270">H</text><text x="330" y="270">A</text>
  </g>
</svg>
