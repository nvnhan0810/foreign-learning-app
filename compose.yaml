# Configure backend/.env with a PostgreSQL URL reachable from these containers.
services:
  migrate:
    build: ./backend
    command: ['-migrate']
    env_file: ./backend/.env
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      BACKEND_ONLY: 'true'
      MEDIA_ROOT: /data/media
    volumes:
      - media:/data/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - '${APP_PORT:-8080}:80'
    depends_on:
      - backend
    restart: unless-stopped
volumes:
  media:
