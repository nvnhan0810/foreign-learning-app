upstream flc_backend { server backend:8080; }
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 55m;
  add_header X-Content-Type-Options nosniff always;

  location = /healthz {
    proxy_pass http://flc_backend;
    include /etc/nginx/proxy_params_flc;
  }
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location = /sw.js {
    add_header Cache-Control no-cache;
    try_files $uri =404;
  }
  location ~ ^/(api|auth|admin|sanctum|logout|media)(/|$) {
    proxy_pass http://flc_backend;
    include /etc/nginx/proxy_params_flc;
  }
  location ~ ^/home/(media/[0-9]+/audio|dictionary/.+/pronounce|word/.*)$ {
    proxy_pass http://flc_backend;
    include /etc/nginx/proxy_params_flc;
  }
  location / {
    error_page 418 = @backend;
    if ($http_x_inertia = "true") { return 418; }
    if ($request_method !~ ^(GET|HEAD)$) { return 418; }
    add_header Cache-Control no-store;
    try_files $uri /index.html;
  }
  location @backend {
    proxy_pass http://flc_backend;
    include /etc/nginx/proxy_params_flc;
  }
}
