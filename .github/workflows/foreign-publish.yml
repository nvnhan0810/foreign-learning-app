name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      deploy_only:
        description: "Skip build, only trigger deploy webhook"
        type: boolean
        default: false
      image_tag:
        description: "Image tag when deploy_only=true (e.g. abc1234). Empty = short SHA."
        required: false
        type: string

concurrency:
  group: foreign-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nvnhan0810/foreign-learning-app
  DEPLOY_REPO: foreign_nvnhan0810_com
  DEPLOY_TAG: production

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.result.outputs.should_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect .github / backend changes
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')
        with:
          base: ${{ github.event.before }}
          ref: ${{ github.event.after }}
          filters: |
            should_build:
              - '.github/**'
              - 'backend/**'

      - name: Set build flag
        id: result
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.deploy_only }}" = "true" ]; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.filter.outputs.should_build }}" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: changes
    if: needs.changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Floating tag for quick pulls / default Deployment
            type=raw,value=main,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            # Pin used by deploy webhook + kustomize
            type=sha,prefix=,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_URL=https://foreign.nvnhan0810.com
          cache-from: type=gha,scope=foreign-learning-app-production
          cache-to: type=gha,mode=max,scope=foreign-learning-app-production
          provenance: false
          sbom: false

  deploy:
    needs: build-and-push
    if: >
      always()
      && github.event_name != 'pull_request'
      && (
        needs.build-and-push.result == 'success'
        || (needs.build-and-push.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.deploy_only == true)
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="${GITHUB_SHA:0:7}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying image tag: ${TAG}"

      - name: Trigger deploy webhook
        env:
          DEPLOY_HOOK_TOKEN: ${{ secrets.DEPLOY_HOOK_TOKEN }}
          DEPLOY_WEBHOOK_TOKEN: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}
        run: |
          DEPLOY_TOKEN="${DEPLOY_HOOK_TOKEN:-$DEPLOY_WEBHOOK_TOKEN}"
          if [ -z "${DEPLOY_TOKEN}" ]; then
            echo "DEPLOY_HOOK_TOKEN secret is not set — skip deploy webhook."
            exit 0
          fi

          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          IMAGE_TAG="${{ steps.image.outputs.tag }}"

          curl -fsS --max-time 30 -X POST 'https://deploy.nvnhan0810.com/deploy' \
            -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
            -H 'Content-Type: application/json' \
            -d "$(jq -n \
              --arg repo "${{ env.DEPLOY_REPO }}" \
              --arg tag "${{ env.DEPLOY_TAG }}" \
              --arg image "${IMAGE}" \
              --arg image_tag "${IMAGE_TAG}" \
              '{repo: $repo, tag: $tag, image: $image, image_tag: $image_tag}')"

          echo "Deploy webhook sent for ${IMAGE}:${IMAGE_TAG}"
